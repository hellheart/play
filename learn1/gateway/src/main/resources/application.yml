server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**
        - id: openapi-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/open-api/**
        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/user/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@inMemoryRateLimiter}"
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user
        - id: bilibili-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/bilibili/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@inMemoryRateLimiter}"
            - name: CircuitBreaker
              args:
                name: bilibiliCircuitBreaker
                fallbackUri: forward:/fallback/bilibili

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      userCircuitBreaker:
        base-config: default
      bilibiliCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
